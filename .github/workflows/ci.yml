name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('internal/resolve/aws/provider.go') }}
      - run: nix develop -c just check
      - run: nix develop -c golangci-lint run ./...
      - run: nix develop -c just acceptance
      - id: pnpm-store
        run: echo "path=$(nix develop -c pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - run: nix develop -c just ui-check
      - run: nix develop -c just ui-test
      - run: nix develop -c just build
